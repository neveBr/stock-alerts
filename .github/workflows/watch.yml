name: Stock news alerts

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub may delay runs by a few minutes)
  workflow_dispatch:         # "Run workflow" button for manual runs

permissions:
  contents: write            # to save watchlist.json / state.json back to the repo

concurrency:
  group: stock-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check news and Telegram commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: python3 stock_news.py

      - name: Save state
        run: |
          git config user.name "stock-alerts-bot"
          git config user.email "stock-alerts-bot@users.noreply.github.com"
          git add watchlist.json state.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update state [skip ci]"
            git pull --rebase -X theirs || true
            git push
          fi
